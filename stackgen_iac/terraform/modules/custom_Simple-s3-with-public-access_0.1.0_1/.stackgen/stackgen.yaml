version: "1.0"
representation:
  description: "Amazon S3 bucket with public access controls. This module provisions an S3 bucket and sets up recommended access block settings."
  icon: "aws_s3_bucket"
  side_panel:
    label: "S3 Bucket"
    icon: "aws_s3_bucket"
  node:
    label_attribute: "bucket_name"
    label:
      static: "S3 Bucket"
      template: "S3 Bucket - ${bucket_name}"
variables:
  bucket_name:
    label: "Bucket Name"
    description: "Globally unique S3 bucket name."
    type: "string"
    ui_control: "text"
    validation:
      required: true
  block_public_policy:
    label: "Block Public Policy"
    description: "Block policies that allow public access to this bucket."
    type: "bool"
    ui_control: "select"
    options: [true, false]
    validation:
      required: true
variable_groups:
  - label: "Bucket Configuration"
    description: "Core S3 bucket settings."
    variables:
      - bucket_name
      - block_public_policy
