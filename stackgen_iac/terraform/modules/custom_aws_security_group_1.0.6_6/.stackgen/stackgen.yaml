version: "1.0"
representation:
  description: "Minimal AWS Security Group module. Specify VPC, group name, and optional ingress/egress rules. Defaults provide a locked-down security group; open ports via variables as needed."
  icon: "aws_security_group"
  side_panel:
    label: "Security Group"
    icon: "aws_security_group"
  node:
    label_attribute: "name"
    label:
      static: "Security Group"
      template: "SG: ${name}"
variables:
  name:
    label: "Security Group Name"
    description: "The name for this security group."
    type: "string"
    ui_control: "text"
    validation:
      required: true
  description:
    label: "Description"
    description: "Security group description."
    type: "string"
    ui_control: "text"
    validation:
      required: true
  vpc_id:
    label: "VPC ID"
    description: "The VPC where to create the security group."
    type: "string"
    ui_control: "text"
    validation:
      required: true
  ingress:
    label: "Ingress Rules"
    description: "List of inbound security group rules."
    type: "list(object)"
    ui_control: "object_list"
    attributes:
      from_port:
        label: "From Port"
        type: "number"
        ui_control: "text"
        validation:
          required: true
      to_port:
        label: "To Port"
        type: "number"
        ui_control: "text"
        validation:
          required: true
      protocol:
        label: "Protocol"
        type: "string"
        ui_control: "select"
        options: ["tcp", "udp", "icmp", "-1"]
        validation:
          required: true
      cidr_blocks:
        label: "CIDR Blocks"
        type: "list(string)"
        ui_control: "text_list"
        validation:
          required: true
      description:
        label: "Rule Description"
        type: "string"
        ui_control: "text"
        validation:
          required: false
  egress:
    label: "Egress Rules"
    description: "List of outbound security group rules."
    type: "list(object)"
    ui_control: "object_list"
    attributes:
      from_port:
        label: "From Port"
        type: "number"
        ui_control: "text"
        validation:
          required: true
      to_port:
        label: "To Port"
        type: "number"
        ui_control: "text"
        validation:
          required: true
      protocol:
        label: "Protocol"
        type: "string"
        ui_control: "select"
        options: ["tcp", "udp", "icmp", "-1"]
        validation:
          required: true
      cidr_blocks:
        label: "CIDR Blocks"
        type: "list(string)"
        ui_control: "text_list"
        validation:
          required: true
      description:
        label: "Rule Description"
        type: "string"
        ui_control: "text"
        validation:
          required: false
  tags:
    label: "Tags"
    description: "Key-value tags to assign to the security group."
    type: "map(string)"
    ui_control: "dictionary"
    validation:
      required: false
variable_groups:
  - label: "Core Settings"
    description: "Basic Security Group configuration."
    variables: ["name", "description", "vpc_id", "tags"]
  - label: "Rules"
    description: "Ingress (inbound) and Egress (outbound) rules."
    variables: ["ingress", "egress"]
